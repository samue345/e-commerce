services:
  postgres:
    image: postgres:16-alpine
    container_name: crud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clientes_db
      POSTGRES_USER: clientes_user
      POSTGRES_PASSWORD: clientes_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientes_user -d clientes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clientes_db
      DB_USER: clientes_user
      DB_PASSWORD: clientes_password
      DB_POOL_SIZE: 10
      APP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clientes_db
      DB_USER: clientes_user
      DB_PASSWORD: clientes_password
      DB_POOL_SIZE: 10
      APP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: crud-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2

volumes:
  postgres_data:
